name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test
        run: |
          npm test
          find src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node --check bin/build-pages
          git diff --check
      - name: Build Pages
        run: bin/build-pages
      - name: Update generated pages snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          parent=$(git ls-remote origin refs/heads/pages | cut -f1)
          parents=()
          if [ -n "$parent" ]; then
            git fetch --no-tags origin refs/heads/pages
            parent=$(git rev-parse FETCH_HEAD)
            parents=(-p "$parent")
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages-index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$GITHUB_WORKSPACE/dist" add --all
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
            echo 'Pages snapshot unchanged.'
          else
            commit=$(git commit-tree "$tree" "${parents[@]}" -m "deploy: $GITHUB_SHA")
            git push origin "$commit:refs/heads/pages"
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
